<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KODE · Phone preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7ece8;color:#173f46;font:14px/1.4 Arial,sans-serif}header{background:#173f46;color:#fffdf7;padding:12px 18px;display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px}h1{font-size:18px;margin:0}header a{color:inherit;margin-left:auto}.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:12px}label{display:flex;align-items:center;gap:6px}select,input,button{font:inherit;color:#173f46;border:1px solid #afc3bd;background:#fffdf7;border-radius:6px;padding:7px}input[type=number]{width:76px}input[type=checkbox]{width:17px;height:17px;accent-color:#173f46}button{cursor:pointer}main{display:flex;justify-content:center;padding:6px 16px 20px;overflow:auto}.holder{flex:none;position:relative}.phone{position:absolute;top:0;left:0;transform-origin:top left;background:#fffdf7;outline:8px solid #173f46;border-radius:12px;overflow:hidden;box-shadow:0 9px 30px #173f4630}iframe{display:block;border:0;background:#f6f3e9;width:100%;height:100%}.note{text-align:center;font-size:12px;margin:0 12px 10px;color:#4a686a}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b9362c;outline-offset:2px}
.phone{display:flex;flex-direction:column}.browser-bar{flex:none;background:#173f46;color:#fffdf7;overflow:hidden}.browser-bar[hidden]{display:none}.browser-top{padding:7px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}.status-line{font-size:11px;display:flex;justify-content:space-between}.address-line{background:#fffdf719;border-radius:18px;padding:7px 12px;font-size:12px;white-space:nowrap}.browser-bottom{display:flex;align-items:center;justify-content:space-around;font-size:23px;border-top:1px solid #ffffff25}.phone iframe{flex:none}.bar-input input{width:60px}.controls{max-width:1100px;margin:auto}
</style>
</head>
<body>
<header><h1>KODE · Phone preview</h1><a href="./" target="_blank" rel="noopener">Open full app ↗</a></header>
<div class="controls" id="controls">
<label>App view <select id="preset"><option value="390,844">390 × 844</option><option value="360,800">Android · 360 × 800</option><option value="412,749">Note 10+ starting size · adjustable</option><option value="412,915">Android · 412 × 915</option><option value="custom" selected>Custom</option></select></label>
<label>Width <input id="width" type="number" min="280" max="1600" value="407"></label>
<label>App height <input id="height" type="number" min="320" max="1600" value="654"></label>
<label><input id="bars" type="checkbox" checked>Browser bars</label><label class="bar-input">Top <input id="topBar" type="number" min="0" max="180" value="72"></label><label class="bar-input">Bottom <input id="bottomBar" type="number" min="0" max="180" value="48"></label>
<button id="rotate">Rotate</button><label><input id="fit" type="checkbox" checked>Fit preview</label><button id="reload">Refresh app</button>
</div>
<p class="note" id="dimensions" aria-live="polite"></p>
<main><div class="holder" id="holder"><div class="phone" id="phone"><div class="browser-bar browser-top" id="browserTop" aria-hidden="true"><div class="status-line"><span>9:41</span><span>▴ ▴ ▰</span></div><div class="address-line">KODE · biggkode.github.io</div></div><iframe id="app" src="./?preview=phone" title="Interactive KODE app at the selected phone size" allow="clipboard-write"></iframe><div class="browser-bar browser-bottom" id="browserBottom" aria-hidden="true"><span>‹</span><span>›</span><span>⌂</span><span>▢</span><span>⋮</span></div></div></div></main>
<script>
const $=id=>document.getElementById(id);
function render(){const w=Math.max(280,Math.min(1600,+$('width').value||407)),h=Math.max(320,Math.min(1600,+$('height').value||654)),bars=$('bars').checked,topHeight=bars?Math.max(0,Math.min(180,+$('topBar').value||0)):0,bottomHeight=bars?Math.max(0,Math.min(180,+$('bottomBar').value||0)):0,total=h+topHeight+bottomHeight;$('browserTop').hidden=!bars;$('browserBottom').hidden=!bars;$('browserTop').style.height=topHeight+'px';$('browserBottom').style.height=bottomHeight+'px';$('app').style.height=h+'px';const top=$('holder').getBoundingClientRect().top+scrollY;const scale=$('fit').checked?Math.min(1,(innerWidth-48)/w,Math.max(280,innerHeight-top-28)/total):1;$('phone').style.width=w+'px';$('phone').style.height=total+'px';$('phone').style.transform='scale('+scale+')';$('holder').style.width=w*scale+'px';$('holder').style.height=total*scale+'px';$('dimensions').textContent='App area '+w+' × '+h+' · including bars '+w+' × '+total+' · preview '+Math.round(scale*100)+'%. Adjust to match your phone. Bars are illustrative.';try{localStorage.setItem('kode-phone-preview',JSON.stringify({w,h,bars,topHeight:$('topBar').value,bottomHeight:$('bottomBar').value,fit:$('fit').checked}));}catch{}}
$('preset').onchange=()=>{if($('preset').value==='custom')return;const [w,h]=$('preset').value.split(',');$('width').value=w;$('height').value=h;render();};
for(const id of ['width','height'])$(id).onchange=()=>{$('preset').value='custom';render();};
for(const id of ['fit','bars','topBar','bottomBar'])$(id).onchange=render;$('rotate').onclick=()=>{const w=$('width').value;$('width').value=$('height').value;$('height').value=w;$('preset').value='custom';render();};
$('reload').onclick=()=>{$('app').src='./?preview=phone&refresh='+Date.now();};window.addEventListener('resize',render);try{const saved=JSON.parse(localStorage.getItem('kode-phone-preview'));if(saved){$('width').value=saved.w;$('height').value=saved.h;$('bars').checked=saved.bars;$('topBar').value=saved.topHeight;$('bottomBar').value=saved.bottomHeight;$('fit').checked=saved.fit;}}catch{}render();
</script>
</body></html>
