<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KODE · Phone preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7ece8;color:#173f46;font:14px/1.4 Arial,sans-serif}header{background:#173f46;color:#fffdf7;padding:12px 18px;display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px}h1{font-size:18px;margin:0}header a{color:inherit;margin-left:auto}.controls{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:12px}label{display:flex;align-items:center;gap:6px}select,input,button{font:inherit;color:#173f46;border:1px solid #afc3bd;background:#fffdf7;border-radius:6px;padding:7px}input[type=number]{width:76px}input[type=checkbox]{width:17px;height:17px;accent-color:#173f46}button{cursor:pointer}main{display:flex;justify-content:center;padding:6px 16px 20px;overflow:auto}.holder{flex:none;position:relative}.phone{position:absolute;top:0;left:0;transform-origin:top left;background:#fffdf7;outline:8px solid #173f46;border-radius:12px;overflow:hidden;box-shadow:0 9px 30px #173f4630}iframe{display:block;border:0;background:#f6f3e9;width:100%;height:100%}.note{text-align:center;font-size:12px;margin:0 12px 10px;color:#4a686a}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b9362c;outline-offset:2px}
</style>
</head>
<body>
<header><h1>KODE · Phone preview</h1><a href="./" target="_blank" rel="noopener">Open full app ↗</a></header>
<div class="controls" id="controls">
<label>Size <select id="preset"><option value="390,844">390 × 844</option><option value="360,800" selected>Android · 360 × 800</option><option value="412,915">Android · 412 × 915</option><option value="custom">Custom</option></select></label>
<label>Width <input id="width" type="number" min="280" max="1600" value="360"></label>
<label>Height <input id="height" type="number" min="320" max="1600" value="800"></label>
<button id="rotate">Rotate</button><label><input id="fit" type="checkbox" checked>Fit preview</label><button id="reload">Refresh app</button>
</div>
<p class="note" id="dimensions" aria-live="polite"></p>
<main><div class="holder" id="holder"><div class="phone" id="phone"><iframe id="app" src="./?preview=phone" title="Interactive KODE app at the selected phone size" allow="clipboard-write"></iframe></div></div></main>
<script>
const $=id=>document.getElementById(id);
function render(){const w=Math.max(280,Math.min(1600,+$('width').value||360)),h=Math.max(320,Math.min(1600,+$('height').value||800));const top=$('holder').getBoundingClientRect().top+scrollY;const scale=$('fit').checked?Math.min(1,(innerWidth-48)/w,Math.max(280,innerHeight-top-28)/h):1;$('phone').style.width=w+'px';$('phone').style.height=h+'px';$('phone').style.transform='scale('+scale+')';$('holder').style.width=w*scale+'px';$('holder').style.height=h*scale+'px';$('dimensions').textContent=w+' × '+h+' CSS pixels · '+Math.round(scale*100)+'% preview size. Scroll and click inside the phone. This checks layout, not Android browser behaviour.';}
$('preset').onchange=()=>{if($('preset').value==='custom')return;const [w,h]=$('preset').value.split(',');$('width').value=w;$('height').value=h;render();};
for(const id of ['width','height'])$(id).onchange=()=>{$('preset').value='custom';render();};
$('fit').onchange=render;$('rotate').onclick=()=>{const w=$('width').value;$('width').value=$('height').value;$('height').value=w;$('preset').value='custom';render();};
$('reload').onclick=()=>{$('app').src='./?preview=phone&refresh='+Date.now();};window.addEventListener('resize',render);render();
</script>
</body></html>
